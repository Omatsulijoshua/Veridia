version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: veridia-postgres
    restart: always
    environment:
      POSTGRES_USER: veridia_user
      POSTGRES_PASSWORD: veridia_password
      POSTGRES_DB: veridia_db
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: veridia-redis
    restart: always
    ports:
      - '6381:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
